<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Pika intro in a HyperFrames video</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body { margin: 0; background: #ffffff; font-family: system-ui, sans-serif; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
      .clip { position: absolute; inset: 0; }
      #next-scene { background: #edfbfd; }
      #next-title { margin: 0; display: grid; place-items: center; font-size: 96px; font-weight: 800; color: #0f172a; }
    </style>
  </head>
  <body>
    <!-- Ví dụ: intro Pika kiểu P1 chạy 0–5 s, rồi một cảnh tiếp theo. Đổi kiểu: đổi p1 thành p2…p8 ở cả data-composition-id và data-composition-src. -->
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="8">
      <div
        id="intro"
        data-composition-id="pika-intro-p1"
        data-composition-src="compositions/pika-intro-p1.html"
        data-start="0"
        data-duration="5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div id="next-scene" class="clip" data-start="5" data-duration="3" data-track-index="2"></div>
      <h1 id="next-title" class="clip" data-start="5" data-duration="3" data-track-index="3">Cảnh tiếp theo</h1>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#next-title", { y: 48, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 5.2);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
